name: Atualizar avaliações do Google

# Dispara um novo build todo dia para o site buscar a nota e as avaliações mais recentes.
# Configure o segredo DEPLOY_HOOK_URL em Settings > Secrets and variables > Actions
# com o deploy hook do Cloudflare Pages (ou da Vercel).

on:
  schedule:
    - cron: "17 9 * * *" # todo dia às 06:17 de Brasília
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar novo build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Segredo DEPLOY_HOOK_URL não configurado; nada a fazer."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Build disparado."
